name: build

on:
  push:
    branches: [debian/latest]
    # Release tags only. Upstream's own tags (v3.1.4, zino-0-9-*) point at
    # commits with no debian/ directory, so they must not trigger a build.
    tags: ['debian/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            codename: trixie
          - image: ubuntu:24.04
            codename: noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gbp exports the orig tarball from the upstream tag, so the whole
          # history and every tag must be present.
          fetch-depth: 0

      - name: Stamp the target suite onto the version
        run: |
          # Yields e.g. 3.1.4-1~trixie1, so one source can be published for
          # several suites without version collisions, the way backports and
          # PPAs do it. "~" sorts before the plain revision, which is correct
          # for a suite rebuild of -1.
          #
          # The commit is throwaway and never pushed: gbp exports HEAD rather
          # than the working tree, so an uncommitted dch would be ignored.
          SUITE='${{ matrix.image }}' ./debian/dev.sh sh -c \
            "dch --local '~${{ matrix.codename }}' \
                 --distribution '${{ matrix.codename }}' \
                 'Rebuild for ${{ matrix.codename }}.'"
          git -c user.name=ci -c user.email=ci@localhost \
              commit -q -am 'CI: stamp suite onto version'

      - name: Build
        env:
          SUITE: ${{ matrix.image }}
        run: ./debian/build.sh

      - name: Report what was built
        run: ls -l build/*/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.codename }}
          path: build/*/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
             --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" build/*/*.deb --clobber
