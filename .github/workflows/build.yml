name: build

on:
  push:
    branches: [debian/latest]
    # Release tags only. Upstream's own tags (v3.1.4, zino-0-9-*) point at
    # commits with no debian/ directory, so they must not trigger a build.
    tags: ['debian/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            codename: trixie
          - image: ubuntu:24.04
            codename: noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gbp exports the orig tarball from the upstream tag, so the whole
          # history and every tag must be present.
          fetch-depth: 0

      - name: Stamp the target suite onto the version
        run: |
          # Yields e.g. 3.1.4-1~trixie1, so one source can be published for
          # several suites without version collisions, the way backports and
          # PPAs do it. "~" sorts before the plain revision, which is correct
          # for a suite rebuild of -1.
          #
          # The commit is throwaway and never pushed: gbp exports HEAD rather
          # than the working tree, so an uncommitted dch would be ignored.
          SUITE='${{ matrix.image }}' ./debian/dev.sh sh -c \
            "dch --local '~${{ matrix.codename }}' \
                 --distribution '${{ matrix.codename }}' \
                 'Rebuild for ${{ matrix.codename }}.'"
          git -c user.name=ci -c user.email=ci@localhost \
              commit -q -am 'CI: stamp suite onto version'

      - name: Build
        env:
          SUITE: ${{ matrix.image }}
        run: ./debian/build.sh

      - name: Report what was built
        run: ls -l build/*/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.codename }}
          path: build/*/*.deb
          if-no-files-found: error

  # Creating the release is a separate job so it happens exactly once, with
  # every suite's packages in hand. Doing it inside the matrix meant both jobs
  # raced to create the same release, and whichever won could only describe
  # its own half of the artifacts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/debian/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Compose the release notes
        run: |
          set -eu
          # A file, not a variable: iterating a multi-line variable depends on
          # word-splitting, which differs between shells and breaks on paths
          # containing whitespace.
          find artifacts -name '*.deb' | sort > debs.txt
          [ -s debs.txt ] || { echo "no packages to release" >&2; exit 1; }
          # The artifact's parent directory is the suite tag the build used.
          while read -r d; do basename "$(dirname "$d")"; done < debs.txt \
            | sort -u > suites.txt

          cp debian/release-intro.md NOTES.md

          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            # GitHub rewrites "~" to "." in release asset filenames, so the
            # command we print must use the name people actually download.
            # One block per suite: installing another suite's build is
            # exactly the mistake a single combined command would invite.
            # -dbgsym is left out; it is debug symbols, not something to
            # install by default.
            first=yes
            while read -r tag; do
              # Blank line *between* blocks, never a trailing one inside the
              # fence.
              [ -n "$first" ] || echo
              first=
              case "$tag" in
                debian-*) label="Debian ${tag#debian-}" ;;
                ubuntu-*) label="Ubuntu ${tag#ubuntu-}" ;;
                *)        label="$tag" ;;
              esac
              echo "# $label"
              printf 'sudo apt install'
              grep "/$tag/" debs.txt | grep -v -- '-dbgsym' | while read -r d; do
                printf ' \\\n    ./%s' "$(basename "$d" | tr '~' '.')"
              done
              echo
            done < suites.txt
            echo '```'
            echo
            echo 'Install only the block matching your distribution.'
            echo
            echo '## Changes'
            echo
            echo '```'
            # The top changelog stanza: everything between the header line and
            # the maintainer signature. No dpkg tooling needed on the runner.
            awk 'NR==1 {next} /^ -- /{exit} {print}' debian/changelog \
              | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac
            echo '```'
            echo
            echo '## Checksums'
            echo
            echo '```'
            while read -r d; do
              printf '%s  %s\n' "$(sha256sum "$d" | cut -d' ' -f1)" \
                                "$(basename "$d" | tr '~' '.')"
            done < debs.txt
            echo '```'
          } >> NOTES.md

          echo "--- composed notes ---"; cat NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag \
             --title "$GITHUB_REF_NAME" --notes-file NOTES.md
          find artifacts -name '*.deb' -exec \
             gh release upload "$GITHUB_REF_NAME" {} +
